		<script th:src="@{/search.js}"></script>
		<script>

		window.offset = 20;
		const limit = 20;

		document.getElementById("moreButton").addEventListener("click", loadMore);

		function loadMore() {

		    fetch(`/patient/list?offset=${offset}&limit=${limit}`)
		        .then(response => response.json())
		        .then(list => {

		            const patientList = document.getElementById("patientList");

		            list.forEach(patient => {

		                const card = document.createElement("a");

		                card.href = "/detail/" + patient.id;
		                card.className =
		                    patient.sex === "M"
		                    ? "patient-card male"
		                    : "patient-card female";

		                card.innerHTML = `
		                    <div class="name">${patient.namae}</div>
		                    <div class="age">(${patient.age})</div>
		                    <div class="gender">${patient.sex === "M" ? "男" : "女"}</div>
		                    <div class="updated">${patient.updateDate.substring(0,10).replaceAll("-","/")} 更新</div>
		                `;

		                patientList.appendChild(card);

		            });

		            offset += list.length;

		            //取得件数が20件未満なら最後なのでボタンを消す
		            if (list.length < limit) {
		                document.getElementById("moreButton").style.display = "none";
		            }

		        });

		}

		</script>
