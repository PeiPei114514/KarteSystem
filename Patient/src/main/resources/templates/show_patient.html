  <script>
  function openDialog() {
      document.getElementById("dialog").style.display = "flex";
  }

  function closeDialog() {
      document.getElementById("dialog").style.display = "none";
  }


  
  const fileInput = document.getElementById("file");

  // 画像を指定の最大辺に収まるようリサイズし、JPEGで圧縮してdataURLを返す
  function compressImage(file, maxSize = 1600, quality = 0.8) {
      return new Promise((resolve, reject) => {
          const img = new Image();
          const reader = new FileReader();

          reader.onload = (e) => {
              img.onload = () => {
                  let { width, height } = img;

                  // 長辺がmaxSizeを超えている場合のみ縮小
                  if (width > maxSize || height > maxSize) {
                      if (width > height) {
                          height = Math.round(height * (maxSize / width));
                          width = maxSize;
                      } else {
                          width = Math.round(width * (maxSize / height));
                          height = maxSize;
                      }
                  }

                  const canvas = document.createElement("canvas");
                  canvas.width = width;
                  canvas.height = height;

                  const ctx = canvas.getContext("2d");
                  ctx.drawImage(img, 0, 0, width, height);

                  // JPEGとして圧縮（元がPNGでも問題形式(問診票の写真)ならJPEGで十分）
                  const dataUrl = canvas.toDataURL("image/jpeg", quality);
                  resolve(dataUrl);
              };
              img.onerror = reject;
              img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
      });
  }

  if (fileInput) {
      fileInput.addEventListener("change", async function () {
          if (this.files.length > 0) {
              const file = this.files[0];

              try {
                  const compressedDataUrl = await compressImage(file, 1600, 0.8);

                  sessionStorage.setItem("questImageData", compressedDataUrl);
                  sessionStorage.setItem("questImageName", file.name.replace(/\.[^.]+$/, "") + ".jpg");
                  sessionStorage.setItem("questImageType", "image/jpeg");

                  location.href = "/insert_form";
              } catch (err) {
                  console.error("画像の圧縮に失敗しました", err);
                  alert("画像の読み込みに失敗しました。別の画像を選んでください。");
              }
          }
      });
  }
  
  </script>
