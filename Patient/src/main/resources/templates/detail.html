<!--削除時に出る確認ダイアログ-->
<div id="deleteDialog" class="dialog" onclick="closeDeleteDialog()">

    <div class="dialogContent" onclick="event.stopPropagation()">

        <button class="closeButton" onclick="closeDeleteDialog()">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <h2>この患者を削除しますか？</h2>

        <form th:action="@{/delete_patient/{id}(id=${patient.id})}" method="get">
            <button type="submit" class="menuButton">はい</button>
        </form>

        <button class="menuButton" onclick="closeDeleteDialog()">
            いいえ
        </button>

		<p>注意【一度削除すると元に戻せません】</p>
    </div>

</div>
			
<!--カルテの追加方法を選択するダイアログ-->
<div id="dialog" class="dialog" onclick="closeDialog()">

    <div class="dialogContent" onclick="event.stopPropagation()">
		

		    <button class="closeButton" onclick="closeDialog()">
		        <i class="fa-solid fa-xmark"></i>
		    </button>

        <h2>新規作成</h2>

        <button   class="menuButton" onclick="document.getElementById('karteFile').click()">
			
			<i class="fa-solid fa-camera"></i>
            写真から作成
        </button>

        <button  class="menuButton"  th:onclick="|location.href='@{/upload_drawing/{id}(id=${patient.id})}'|">
           <i class="fa-solid fa-pen"></i>お絵かきで作成
        </button>



    </div>

</div>

<script>
	
	//追加をすぐ反映するためにリロードする
	window.addEventListener("pageshow", function(event) {

	    if (event.persisted) {
	        location.reload();
	    }

	});

	
  function openDialog() {
      document.getElementById("dialog").style.display = "flex";
  }

  function closeDialog() {
      document.getElementById("dialog").style.display = "none";
  }
  
  function openDeleteDialog() {
      document.getElementById("deleteDialog").style.display = "flex";
  }

  function closeDeleteDialog() {
      document.getElementById("deleteDialog").style.display = "none";
  }

//  const fileInput = document.getElementById("file");

const karteFile = document.getElementById("karteFile");

karteFile.addEventListener("change", function () {
    if (this.files.length > 0) {
        document.getElementById("karteUploadForm").submit();
    }
	});
	const questFile = document.getElementById("questFile");

	questFile.addEventListener("change", function () {
	    if (this.files.length > 0) {
	        document.getElementById("questUploadForm").submit();
	    }
		});
  
//  // 画像をクリックしたらファイル選択を開く
  document.querySelector("#questUploadForm img").addEventListener("click", function () {
      document.getElementById("questFile").click();
  });
