<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>問診票一覧</title>
<link rel="stylesheet"
         href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class=karte-quest-list-page>
	<!-- 新規追加ボタン -->
	
	
	
	<form id="questUploadForm"
				      action="/new_upload_quest"
				      method="post"
				      enctype="multipart/form-data">

				    <input type="hidden" name="id" th:value="${patient.id}">

				    <input type="file"
				           id="questFile"
				           name="img_file"
				           accept="image/*"
				           style="display:none">
				
		<button type="button" class="fab-button" id="questButton" >
	    <i class="fa-solid fa-plus"></i>
	</button>
			</form>
	
	<header class="app-header">

<!--		<form th:action="@{/back_show_patient/{id}(id=${patient.id})}" method="post">-->
<!--	    <button type="submit"  class="header-left">-->
<!--	        <i class="fa-solid fa-chevron-left"></i>-->
<!--	    </button>-->
<!--</form>-->

<form th:action="@{/back_show_patient/{id}(id=${patient.id})}" method="post">

    <input type="hidden" name="page" th:value="${currentPage}">

	<input type="hidden" name="type" value="quest">
    <button type="submit" class="header-left">
        <i class="fa-solid fa-chevron-left"></i>
    </button>
</form>
	    <div class="header-center">
	        <div class="header-main">
				問診票一覧
	        </div>
			<div class="header-sub">
				    <span th:text="${patient.namae + '　　'}"></span>
				    <span th:if="${patient.age!=null}" th:text="${'(' + patient.age + ')'}"></span>
				    <span th:if="${patient.sex!=null}" th:text="${'　　（' + (patient.sex == 'M' ? '男' : '女') + '）'}"></span>
				</div>
	    </div>
		

		<div id="header"></div>
			<script src="/common/header-menu.js"></script>

	</header>

	
	
<!--	<form action="/new_upload_quest" method="post" enctype="multipart/form-data">-->
<!--			enctypeがないとファイルの名前しか送られない-->
<!--			<input type="file" name="img_file" accept="image/*" required>-->
<!--			<input type="hidden" name="id" th:value="${patient.id}">-->
<!--			<button type="submit">アップロード</button>	-->
<!--			<input type="submit" value="アップロード">-->
<!--		</form>-->
		
<main class="questMain">
<div class="questContent">
		<div class="karte-list">
		
	<div class="karte_position" th:each="quest:${questPage.content}">
	 <span>
		<a th:href="@{/show_quest_detail/{id}(id=${quest.id})}">
		 <img th:src="@{/images/{img}(img=${quest.imgFilePath})}" 
		width="240" height="320" alt="問診票の画像">
		</a>
	 </span>
	
		<p th:text="${#temporals.format(quest.updateDate,'yyyy/MM/dd')}"></p>
	</div>
	</div>
	
	
	<div class="pageArea" th:if="${questPage.totalElements > 0}">

	    <a th:if="${questPage.hasPrevious()}"
	       th:href="@{/show_quest/{id}(id=${patient.id},page=${currentPage-1})}">
	        ＜
	    </a>

	    <span th:each="i : ${#numbers.sequence(0, questPage.totalPages-1)}">

	        <a th:if="${i != currentPage}"
	           th:href="@{/show_quest/{id}(id=${patient.id},page=${i})}"
	           th:text="${i+1}"></a>

	        <span th:if="${i == currentPage}"
	              th:text="${i+1}"></span>

	    </span>

	    <a th:if="${questPage.hasNext()}"
	       th:href="@{/show_quest/{id}(id=${patient.id},page=${currentPage+1})}">
	        ＞
	    </a>

	</div>
	
	</div>
	</main>
<!--	<img src="/images/tanaka.png">-->
<script>


		const questFile = document.getElementById("questFile");

		questFile.addEventListener("change", function () {
		    if (this.files.length > 0) {
		        document.getElementById("questUploadForm").submit();
		    }
			});
	  
	//  // 画像をクリックしたらファイル選択を開く
	  document.querySelector("#questButton").addEventListener("click", function () {
	      document.getElementById("questFile").click();
	  });
</script>

</bodykarte-quest-list-page>
</html>
